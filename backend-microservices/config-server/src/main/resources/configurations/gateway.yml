server:
  port: 8090

spring:
  application:
    name: gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: user-service
            uri: lb://user-service
            predicates:
              - Path=/auth/**, /users/**
          - id: demande-service
            uri: lb://demande-service
            predicates:
              - Path=/demandes/**
        

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
